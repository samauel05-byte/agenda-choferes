<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programador de Logística - Porto Valencia</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --turquesa: #00BCD4;
            --turquesa-dark: #17A2B8;
            --naranja: #E85E2E;
            --gris: #808080;
            --gris-dark: #333;
            --gris-light: #F5F5F5;
            --blanco: #FFF;
            --error: #d32f2f;
            --success: #388e3c;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f0f2f5;
            color: var(--gris-dark);
            line-height: 1.6;
        }

        header {
            background: linear-gradient(135deg, var(--blanco) 0%, var(--gris-light) 100%);
            border-bottom: 3px solid var(--turquesa);
            box-shadow: 0 2px 8px rgba(0,0,0,.1);
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo-text h1 {
            font-size: 1.5rem;
            color: var(--naranja);
            font-weight: bold;
        }

        .container {
            max-width: 1400px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            border-bottom: 2px solid #e0e0e0;
        }

        .tab-btn {
            padding: 1rem 1.5rem;
            border: none;
            background: none;
            cursor: pointer;
            font-weight: 600;
            color: var(--gris);
            border-bottom: 3px solid transparent;
            transition: all .3s ease;
        }

        .tab-btn.active {
            color: var(--turquesa);
            border-bottom-color: var(--turquesa);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .card {
            background: var(--blanco);
            border-radius: 8px;
            padding: 1.5rem;
            box-shadow: 0 2px 8px rgba(0,0,0,.08);
            border-left: 4px solid var(--turquesa);
            margin-bottom: 2rem;
        }

        .section-title {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--naranja);
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: .5rem;
            font-weight: 600;
            color: var(--gris-dark);
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: .75rem;
            border: 2px solid #e0e0e0;
            border-radius: 4px;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--turquesa);
            box-shadow: 0 0 0 3px rgba(0,188,212,.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .btn {
            padding: .75rem 1.5rem;
            border: none;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            transition: all .3s ease;
        }

        .btn-primary {
            background: var(--turquesa);
            color: var(--blanco);
        }

        .btn-primary:hover {
            background: var(--turquesa-dark);
        }

        .btn-secondary {
            background: var(--naranja);
            color: var(--blanco);
        }

        .btn-danger {
            background: var(--error);
            color: var(--blanco);
        }

        .btn-success {
            background: var(--success);
            color: var(--blanco);
        }

        .btn-block {
            width: 100%;
        }

        .item-card {
            background: var(--blanco);
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            border-top: 4px solid var(--turquesa);
            box-shadow: 0 2px 8px rgba(0,0,0,.08);
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .item-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--naranja);
        }

        .item-actions {
            display: flex;
            gap: 0.5rem;
        }

        .item-actions .btn {
            padding: 0.5rem 1rem;
            font-size: 0.85rem;
        }

        .msg {
            padding: 1rem;
            border-radius: 4px;
            margin-bottom: 1rem;
        }

        .msg-success {
            background: #e8f5e9;
            color: var(--success);
        }

        .msg-error {
            background: #ffebee;
            color: var(--error);
        }

        .loading {
            text-align: center;
            padding: 2rem;
            color: var(--gris);
        }

        footer {
            background: var(--gris-dark);
            color: var(--blanco);
            text-align: center;
            padding: 2rem;
            margin-top: 3rem;
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            
            .tabs {
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>
    <header>
        <div>
            <h1 style="color: var(--naranja); font-size: 1.5rem;">🚀 PORTO VALENCIA</h1>
            <p style="color: var(--turquesa); font-size: 0.9rem;">Programador Logístico</p>
        </div>
    </header>

    <div class="container">
        <div id="mensaje"></div>

        <div class="tabs">
            <button class="tab-btn active" onclick="cambiarTab('proyectos')">Proyectos</button>
            <button class="tab-btn" onclick="cambiarTab('areas')">Áreas</button>
            <button class="tab-btn" onclick="cambiarTab('equipos')">Equipos</button>
        </div>

        <!-- TAB: PROYECTOS -->
        <div id="tab-proyectos" class="tab-content active">
            <div class="card">
                <h2 class="section-title">Nuevo Proyecto</h2>
                <form id="formProyecto" onsubmit="guardarProyecto(event)">
                    <div class="form-group">
                        <label for="nomProyecto">Nombre del Proyecto</label>
                        <input type="text" id="nomProyecto" required>
                    </div>
                    <div class="form-group">
                        <label for="esGarantia">
                            <input type="checkbox" id="esGarantia"> Es de garantía
                        </label>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">Guardar Proyecto</button>
                </form>
            </div>

            <div class="card">
                <h2 class="section-title">Proyectos Registrados</h2>
                <div id="listaProyectos" class="loading">Cargando...</div>
            </div>
        </div>

        <!-- TAB: ÁREAS -->
        <div id="tab-areas" class="tab-content">
            <div class="card">
                <h2 class="section-title">Nueva Área de Proyecto</h2>
                <form id="formArea" onsubmit="guardarArea(event)">
                    <div class="form-group">
                        <label for="nomArea">Nombre del Área</label>
                        <input type="text" id="nomArea" required>
                    </div>
                    <div class="form-group">
                        <label for="descArea">Descripción</label>
                        <textarea id="descArea" rows="3"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">Guardar Área</button>
                </form>
            </div>

            <div class="card">
                <h2 class="section-title">Áreas Registradas</h2>
                <div id="listaAreas" class="loading">Cargando...</div>
            </div>
        </div>

        <!-- TAB: EQUIPOS -->
        <div id="tab-equipos" class="tab-content">
            <div class="card">
                <h2 class="section-title">Nuevo Equipo</h2>
                <form id="formEquipo" onsubmit="guardarEquipo(event)">
                    <div class="form-group">
                        <label for="nomEquipo">Nombre del Equipo</label>
                        <input type="text" id="nomEquipo" required>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="codEquipo">Código</label>
                            <input type="text" id="codEquipo" required>
                        </div>
                        <div class="form-group">
                            <label for="tipoEquipo">Tipo</label>
                            <select id="tipoEquipo" required>
                                <option>Grúa</option>
                                <option>Excavadora</option>
                                <option>Montacarga</option>
                                <option>Camión</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="proyEquipo">Proyecto</label>
                            <select id="proyEquipo"></select>
                        </div>
                        <div class="form-group">
                            <label for="areaEquipo">Área</label>
                            <select id="areaEquipo"></select>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">Guardar Equipo</button>
                </form>
            </div>

            <div class="card">
                <h2 class="section-title">Equipos Registrados</h2>
                <div id="listaEquipos" class="loading">Cargando...</div>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2024 Porto Valencia - Programador de Logística</p>
    </footer>

    <script>
        const SUPABASE_URL = 'https://aatkhrckyibdserbgvno.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFhdGtocmNreWliZHNlcmJndm5vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUxNTkxNjQsImV4cCI6MjEwMDczNTE2NH0.KG8XZZxOaW8zPvUVVG8VkQvRpN8Y9pF0TW2QdVhEn5c';

        const { createClient } = window.supabase;
        const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

        function mostrarMsg(texto, tipo = 'success') {
            const div = document.getElementById('mensaje');
            div.innerHTML = `<div class="msg msg-${tipo}">${texto}</div>`;
            setTimeout(() => div.innerHTML = '', 4000);
        }

        function cambiarTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(`tab-${tab}`).classList.add('active');
            event.target.classList.add('active');

            if (tab === 'proyectos') cargarProyectos();
            else if (tab === 'areas') cargarAreas();
            else if (tab === 'equipos') cargarEquipos();
        }

        // PROYECTOS
        async function cargarProyectos() {
            const { data } = await supabase.from('proyectos').select('*').order('created_at', { ascending: false });
            const html = !data?.length ? '<p style="color: #999;">No hay proyectos</p>' :
                data.map(p => `
                    <div class="item-card">
                        <div class="item-header">
                            <div class="item-title">${p.nombre}</div>
                            <div class="item-actions">
                                <button class="btn btn-danger" onclick="eliminarProyecto(${p.id})">Eliminar</button>
                            </div>
                        </div>
                        <p style="font-size: 0.9rem; color: #666;">Garantía: ${p.es_garantia ? 'Sí' : 'No'}</p>
                    </div>
                `).join('');
            document.getElementById('listaProyectos').innerHTML = html;
        }

        async function guardarProyecto(e) {
            e.preventDefault();
            const { error } = await supabase.from('proyectos').insert([{
                nombre: document.getElementById('nomProyecto').value,
                es_garantia: document.getElementById('esGarantia').checked
            }]);
            if (error) return mostrarMsg(`Error: ${error.message}`, 'error');
            mostrarMsg('✓ Proyecto guardado');
            document.getElementById('formProyecto').reset();
            cargarProyectos();
            cargarSelectProyectos();
        }

        async function eliminarProyecto(id) {
            if (!confirm('¿Eliminar?')) return;
            const { error } = await supabase.from('proyectos').delete().eq('id', id);
            if (error) return mostrarMsg(`Error: ${error.message}`, 'error');
            mostrarMsg('✓ Eliminado');
            cargarProyectos();
        }

        // ÁREAS
        async function cargarAreas() {
            const { data } = await supabase.from('areas').select('*').order('created_at', { ascending: false });
            const html = !data?.length ? '<p style="color: #999;">No hay áreas</p>' :
                data.map(a => `
                    <div class="item-card">
                        <div class="item-header">
                            <div class="item-title">${a.nombre}</div>
                            <div class="item-actions">
                                <button class="btn btn-danger" onclick="eliminarArea(${a.id})">Eliminar</button>
                            </div>
                        </div>
                        <p style="font-size: 0.9rem; color: #666;">${a.descripcion || 'Sin descripción'}</p>
                    </div>
                `).join('');
            document.getElementById('listaAreas').innerHTML = html;
        }

        async function guardarArea(e) {
            e.preventDefault();
            const { error } = await supabase.from('areas').insert([{
                nombre: document.getElementById('nomArea').value,
                descripcion: document.getElementById('descArea').value
            }]);
            if (error) return mostrarMsg(`Error: ${error.message}`, 'error');
            mostrarMsg('✓ Área guardada');
            document.getElementById('formArea').reset();
            cargarAreas();
            cargarSelectAreas();
        }

        async function eliminarArea(id) {
            if (!confirm('¿Eliminar?')) return;
            const { error } = await supabase.from('areas').delete().eq('id', id);
            if (error) return mostrarMsg(`Error: ${error.message}`, 'error');
            mostrarMsg('✓ Eliminada');
            cargarAreas();
        }

        // EQUIPOS
        async function cargarEquipos() {
            const { data } = await supabase.from('equipos').select('*').order('created_at', { ascending: false });
            const html = !data?.length ? '<p style="color: #999;">No hay equipos</p>' :
                data.map(eq => `
                    <div class="item-card">
                        <div class="item-header">
                            <div class="item-title">${eq.nombre}</div>
                            <div class="item-actions">
                                <button class="btn btn-danger" onclick="eliminarEquipo(${eq.id})">Eliminar</button>
                            </div>
                        </div>
                        <p style="font-size: 0.9rem; color: #666;">Código: ${eq.codigo} | Tipo: ${eq.tipo} | Estado: ${eq.estado}</p>
                    </div>
                `).join('');
            document.getElementById('listaEquipos').innerHTML = html;
        }

        async function guardarEquipo(e) {
            e.preventDefault();
            const { error } = await supabase.from('equipos').insert([{
                nombre: document.getElementById('nomEquipo').value,
                codigo: document.getElementById('codEquipo').value,
                tipo: document.getElementById('tipoEquipo').value,
                estado: 'activo',
                activo: true,
                proyecto_id: document.getElementById('proyEquipo').value || null
            }]);
            if (error) return mostrarMsg(`Error: ${error.message}`, 'error');
            mostrarMsg('✓ Equipo guardado');
            document.getElementById('formEquipo').reset();
            cargarEquipos();
        }

        async function eliminarEquipo(id) {
            if (!confirm('¿Eliminar?')) return;
            const { error } = await supabase.from('equipos').delete().eq('id', id);
            if (error) return mostrarMsg(`Error: ${error.message}`, 'error');
            mostrarMsg('✓ Eliminado');
            cargarEquipos();
        }

        // Cargar selects
        async function cargarSelectProyectos() {
            const { data } = await supabase.from('proyectos').select('id, nombre');
            const sel = document.getElementById('proyEquipo');
            sel.innerHTML = '<option value="">-- Ninguno --</option>' + 
                (data?.map(p => `<option value="${p.id}">${p.nombre}</option>`).join('') || '');
        }

        async function cargarSelectAreas() {
            const { data } = await supabase.from('areas').select('id, nombre');
            const sel = document.getElementById('areaEquipo');
            sel.innerHTML = '<option value="">-- Ninguna --</option>' + 
                (data?.map(a => `<option value="${a.id}">${a.nombre}</option>`).join('') || '');
        }

        // Iniciar
        document.addEventListener('DOMContentLoaded', () => {
            cargarProyectos();
            cargarSelectProyectos();
            cargarSelectAreas();
        });
    </script>
</body>
</html>
